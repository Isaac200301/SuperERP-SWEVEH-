# Pipeline de PR y de main (docs/06 §13.2, skill sweveh-ci-cd-calidad). Paridad con `make ci`.
# Acciones fijadas por SHA de commit (consultado con git ls-remote el 2026-11-01); Dependabot las actualiza.
name: ci

on:
  pull_request:
  push:
    branches: [main, developer]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLC_IMAGE: sqlc/sqlc:1.29.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Alinear con la versión del proyecto de Supabase cuando exista (Sin dato hoy).
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      SWEVEH_TEST_ADMIN_URL: postgres://postgres:ci_only@localhost:5432/postgres?sslmode=disable
      SWEVEH_TEST_ROLE_PASSWORD: ci_only_roles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Código generado sin diferencias (sqlc)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SQLC_IMAGE" generate
          git diff --exit-code -- internal
      - name: Lint (golangci-lint con depguard)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Pruebas con -race, Postgres real y umbral de cobertura (R-11)
        run: sh scripts/coverage.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-go
          path: .cache/cover.out
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipos del contrato sin diferencias
        run: |
          npm run gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run --coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-web
          path: web/coverage/lcov.info
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (historial completo)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --config /repo/.gitleaks.toml
      # Snyk necesita el binario de Go para resolver el árbol de go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Snyk SCA (dependencias Go y npm)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            # No se oculta: queda un aviso visible en el resumen del run (docs/02 §7 punto 3).
            echo "::warning title=Snyk sin configurar::Falta el secreto SNYK_TOKEN. Crear la cuenta requiere aprobación de Isaac/Pablo (docs/02 §3.3)."
            exit 0
          fi
          npx --yes snyk@1.1308.3 test --all-projects --severity-threshold=high

  sonar:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .cache/artefactos
      - name: ¿SonarQube Cloud configurado?
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "${{ vars.SONAR_ORGANIZATION }}" ] || [ -z "${{ vars.SONAR_PROJECT_KEY }}" ]; then
            echo "::warning title=SonarQube Cloud sin configurar::Faltan SONAR_TOKEN, vars.SONAR_ORGANIZATION o vars.SONAR_PROJECT_KEY. Crear la cuenta requiere aprobación de Isaac/Pablo."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.go.coverage.reportPaths=.cache/artefactos/cobertura-go/cover.out
            -Dsonar.javascript.lcov.reportPaths=.cache/artefactos/cobertura-web/lcov.info
