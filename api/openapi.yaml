openapi: 3.0.3
info:
  title: SWEVEH API
  version: 0.1.0
  description: |
    API del panel y del piso de SWEVEH (realm taller). Mismo origen que el frontend.
    Sesión por cookies HttpOnly (`__Host-sw_at` de acceso, `__Secure-sw_rt` de refresh).
    Toda solicitud que cambia estado exige `X-Requested-With: sweveh` y un `Origin` permitido.
    Errores en RFC 9457 (`application/problem+json`). Fechas en UTC (ISO 8601).
    El `taller_id` nunca viaja en la solicitud: sale de la sesión.
servers:
  - url: /api/v1
security:
  - cookieAuth: []

paths:
  /auth/otp:
    post:
      operationId: requestCode
      summary: Pedir un código de un solo uso (HU-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular]
              properties:
                celular: { type: string, example: '3001234567', description: 'Celular colombiano de 10 dígitos' }
      responses:
        '202':
          description: Código enviado. La respuesta es la misma exista o no la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [venceEn]
                properties:
                  venceEn: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/otp/verify:
    post:
      operationId: verifyCode
      summary: Verificar el código; crea la cuenta (con nombre y autorización, HU-02) o inicia sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular, codigo]
              properties:
                celular: { type: string }
                codigo: { type: string, pattern: '^[0-9]{6}$' }
                nombre: { type: string, maxLength: 120, description: 'Solo para cuenta nueva' }
                autorizacionDatos: { type: boolean, description: 'Casilla de la política de datos, sin marcar por defecto (HU-02)' }
      responses:
        '200':
          description: Sesión iniciada. Pone las cookies de sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotar el refresh token (si se reutiliza uno viejo, se revoca la sesión)
      security: []
      responses:
        '200':
          description: Nuevas cookies de sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar sesión (idempotente)
      security: []
      responses:
        '204': { description: Sesión cerrada y cookies vencidas. }

  /me:
    get:
      operationId: getMe
      summary: Usuario y taller de la sesión actual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/Problem' }

  /customers:
    post:
      operationId: registerCustomer
      summary: Buscar o crear un cliente por celular (HU-09). Permiso customer:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular, nombre]
              properties:
                celular: { type: string }
                nombre: { type: string, maxLength: 120 }
                correo: { type: string, nullable: true }
      responses:
        '200':
          description: El celular ya existía en el taller; se devuelve ese cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCliente' }
        '201':
          description: Cliente creado con autorización pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCliente' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCustomers
      summary: Clientes del taller; con q busca por nombre o celular. Permiso customer:read
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes: { type: array, items: { $ref: '#/components/schemas/Cliente' } }

  /customers/by-phone/{celular}:
    get:
      operationId: getCustomerByPhone
      summary: Buscar un cliente por celular. Permiso customer:create
      parameters:
        - { name: celular, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/Problem' }

  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Ver un cliente. Permiso customer:read_all
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles:
    post:
      operationId: registerVehicle
      summary: Buscar por placa o crear un vehículo, carro o moto, con su motor (HU-10, HU-11). Permiso vehicle:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [placa]
              properties:
                placa: { type: string, example: 'KLM482' }
                tipo: { type: string, enum: [carro, moto], description: 'Obligatorio solo para placa especial' }
                confirmarPlacaEspecial: { type: boolean }
                clienteId: { type: string, format: uuid, description: 'Obligatorio si el vehículo no existe' }
                marca: { type: string, nullable: true, maxLength: 60 }
                linea: { type: string, nullable: true, maxLength: 60 }
                modeloAnio: { type: integer, nullable: true }
                kilometraje: { type: integer, nullable: true, minimum: 0 }
                cilindraje: { type: string, nullable: true, description: '"1200", "1200 cc" o "1.2 L"; se guarda en cc' }
                turbo: { type: boolean, nullable: true }
                energia: { type: string, nullable: true, enum: [gasolina, diesel, gas, hibrido, hibrido_enchufable, electrico, null], description: 'Moto: gasolina o electrico' }
                aspiracion: { type: string, nullable: true, enum: [atmosferico, turbo, supercargado, null], description: 'Si llega, manda sobre turbo; moto: atmosferico o turbo' }
                transmision: { type: string, nullable: true, enum: [manual, automatica, cvt, doble_embrague, amt, semiautomatica, null], description: 'Carro: manual, automatica, cvt, doble_embrague, amt; moto: manual, automatica, semiautomatica' }
                traccion: { type: string, nullable: true, enum: [delantera, trasera, awd, 4x4, null], description: 'Solo carro' }
                ciclo: { type: string, nullable: true, enum: [2t, 4t, null], description: 'Solo moto' }
                refrigeracion: { type: string, nullable: true, enum: [aire, liquido, null], description: 'Solo moto' }
                color: { type: string, nullable: true, maxLength: 60 }
                carroceria: { type: string, nullable: true, enum: [sedan, hatchback, suv, pickup, van, otra, null], description: 'Solo carro' }
                llanta: { type: string, nullable: true, maxLength: 20, description: '205/55 R16 o 90/90-17' }
      responses:
        '200':
          description: La placa ya existía en el taller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroVehiculo' }
        '201':
          description: Vehículo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroVehiculo' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /vehicles/by-plate/{placa}:
    get:
      operationId: getVehicleByPlate
      summary: Buscar un vehículo por placa. Permiso vehicle:read
      parameters:
        - { name: placa, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}:
    get:
      operationId: getVehicle
      summary: Ver un vehículo. Permiso vehicle:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}/engine:
    patch:
      operationId: updateVehicleEngine
      summary: Completar o cambiar la ficha del vehículo (motor, caja, tracción, color, carrocería, llanta); queda en la bitácora (HU-11). Permiso vehicle:update
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"v1"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cilindraje: { type: string, nullable: true }
                turbo: { type: boolean, nullable: true }
                energia: { type: string, nullable: true, enum: [gasolina, diesel, gas, hibrido, hibrido_enchufable, electrico, null], description: 'Moto: gasolina o electrico' }
                aspiracion: { type: string, nullable: true, enum: [atmosferico, turbo, supercargado, null], description: 'Si llega, manda sobre turbo; moto: atmosferico o turbo' }
                transmision: { type: string, nullable: true, enum: [manual, automatica, cvt, doble_embrague, amt, semiautomatica, null], description: 'Carro: manual, automatica, cvt, doble_embrague, amt; moto: manual, automatica, semiautomatica' }
                traccion: { type: string, nullable: true, enum: [delantera, trasera, awd, 4x4, null], description: 'Solo carro' }
                ciclo: { type: string, nullable: true, enum: [2t, 4t, null], description: 'Solo moto' }
                refrigeracion: { type: string, nullable: true, enum: [aire, liquido, null], description: 'Solo moto' }
                color: { type: string, nullable: true, maxLength: 60 }
                carroceria: { type: string, nullable: true, enum: [sedan, hatchback, suv, pickup, van, otra, null], description: 'Solo carro' }
                llanta: { type: string, nullable: true, maxLength: 20, description: '205/55 R16 o 90/90-17' }
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      operationId: openOrder
      summary: Abrir una orden desde la placa (HU-16). Permiso order:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sintoma]
              properties:
                vehiculoId: { type: string, format: uuid }
                placa: { type: string }
                sintoma: { type: string, maxLength: 2000 }
                estadoInicial: { type: string, enum: [por_recibir, recibido] }
                confirmarDuplicada: { type: boolean }
                ejemplo: { type: boolean, description: 'Orden de ejemplo del arranque (HU-05); no cuenta en los KPIs' }
      responses:
        '201':
          description: Orden creada con número consecutivo del taller.
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrders
      summary: Órdenes recientes (paginación por cursor). Permiso order:read
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ordenes, siguiente]
                properties:
                  ordenes: { type: array, items: { $ref: '#/components/schemas/Orden' } }
                  siguiente: { type: string, nullable: true }

  /orders/{id}:
    get:
      operationId: getOrder
      summary: Ver una orden con su historial de estados. Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/mine:
    get:
      operationId: listMyOrders
      summary: Órdenes asignadas a quien consulta (HU-23, HU-81). Permiso order:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ordenes]
                properties:
                  ordenes: { type: array, items: { $ref: '#/components/schemas/Orden' } }

  /orders/{id}/transition:
    post:
      operationId: transitionOrder
      summary: Mover la orden un paso adelante o atrás (HU-20, HU-25). Permiso order:update_state
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado, version]
              properties:
                estado: { $ref: '#/components/schemas/EstadoOrden' }
                version: { type: integer }
                motivo: { type: string, description: 'Obligatorio si el dueño avanza a En reparación sin aprobación' }
                recogidoPor: { type: string, description: 'Obligatorio al pasar a Entregado' }
                accesoriosConfirmados: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancelar una orden con motivo (HU-26). Permiso order:cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, version]
              properties:
                motivo: { type: string }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/assignment:
    patch:
      operationId: assignOrder
      summary: Asignar mecánico y fecha prometida (HU-22). Permiso order:assign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mecanicoId: { type: string, format: uuid, nullable: true }
                fechaPrometida: { type: string, format: date-time, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/checklist:
    get:
      operationId: getChecklist
      summary: Checklist de recepción y lo que falta (HU-17, HU-18). Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Checklist' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveChecklist
      summary: Guardar el checklist de recepción (HU-17, HU-18). Permiso evidence:upload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kilometraje: { type: integer, nullable: true }
                combustible: { type: string, nullable: true }
                accesorios: { type: array, items: { type: string } }
                salvedades: { type: array, items: { $ref: '#/components/schemas/Salvedad' } }
                items: { type: array, items: { $ref: '#/components/schemas/ItemRevisado' }, description: 'Solo clave, estado y nota; los nombres los pone el taller' }
      responses:
        '200': { $ref: '#/components/responses/Checklist' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/findings:
    get:
      operationId: listFindings
      summary: Hallazgos del diagnóstico de la orden (HU-103 propuesta). Sin precios. Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hallazgos]
                properties:
                  hallazgos: { type: array, items: { $ref: '#/components/schemas/Hallazgo' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addFinding
      summary: Registrar un hallazgo (desde Recibido hasta En reparación). Lo hace una persona, no la IA. Permiso order:diagnose
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sistema, descripcion, gravedad]
              properties:
                sistema: { $ref: '#/components/schemas/SistemaVehiculo' }
                descripcion: { type: string, maxLength: 1000 }
                gravedad: { $ref: '#/components/schemas/Gravedad' }
                codigosFalla: { type: array, maxItems: 10, items: { type: string, example: 'P0301' } }
                manoObra: { type: integer, format: int64, minimum: 0, nullable: true }
      responses:
        '201':
          description: Hallazgo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hallazgo' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /orders/{id}/findings/{fid}:
    delete:
      operationId: deleteFinding
      summary: Borrar un hallazgo antes de enviar la cotización. Permiso order:diagnose
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /orders/{id}/evidence:
    get:
      operationId: listEvidence
      summary: Fotos y notas de la orden (HU-21). Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [evidencias]
                properties:
                  evidencias: { type: array, items: { $ref: '#/components/schemas/Evidencia' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addEvidence
      summary: Agregar foto y/o nota (HU-21). La foto va al final del formulario. Permiso evidence:upload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                lado: { type: string }
                nota: { type: string }
                mostrarCliente: { type: boolean }
                hallazgoId: { type: string, format: uuid, description: 'Foto de un hallazgo de esta orden' }
                foto: { type: array, maxItems: 8, items: { type: string, format: binary }, description: 'Una o varias fotos (máx. 8); van al final del formulario' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidencia' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /orders/{id}/evidence/{eid}/file:
    get:
      operationId: getEvidencePhoto
      summary: Descargar la foto de una evidencia (privada). Permiso order:read
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: eid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Imagen
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote:
    get:
      operationId: getQuote
      summary: Cotización vigente de la orden; si aún no hay, cotizacion es null (HU-27). Permiso quote:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/lines:
    post:
      operationId: addQuoteLine
      summary: Agregar un servicio o repuesto a la cotización (HU-27, HU-34). Permiso quote:edit
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, cantidad]
              properties:
                tipo: { type: string, description: 'servicio o repuesto' }
                refId: { type: string, format: uuid, nullable: true }
                descripcion: { type: string }
                cantidad: { type: integer, minimum: 1 }
                precioUnitario: { type: integer, format: int64, nullable: true, description: 'COP sin decimales' }
                horas: { type: number, minimum: 0.25, maximum: 200, description: 'Mano de obra por horas: el precio es horas × tarifa del taller' }
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/lines/{lineId}:
    patch:
      operationId: updateQuoteLine
      summary: Cambiar la cantidad o, solo en precio libre, el precio de un ítem del borrador (HU-27). Permiso quote:edit
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cantidad: { type: integer, minimum: 1 }
