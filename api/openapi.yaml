openapi: 3.0.3
info:
  title: SWEVEH API
  version: 0.1.0
  description: |
    API del panel y del piso de SWEVEH (realm taller). Mismo origen que el frontend.
    Sesión por cookies HttpOnly (`__Host-sw_at` de acceso, `__Secure-sw_rt` de refresh).
    Toda solicitud que cambia estado exige `X-Requested-With: sweveh` y un `Origin` permitido.
    Errores en RFC 9457 (`application/problem+json`). Fechas en UTC (ISO 8601).
    El `taller_id` nunca viaja en la solicitud: sale de la sesión.
servers:
  - url: /api/v1
security:
  - cookieAuth: []

paths:
  /auth/otp:
    post:
      operationId: requestCode
      summary: Pedir un código de un solo uso (HU-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular]
              properties:
                celular: { type: string, example: '3001234567', description: 'Celular colombiano de 10 dígitos' }
      responses:
        '202':
          description: Código enviado. La respuesta es la misma exista o no la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [venceEn]
                properties:
                  venceEn: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/otp/verify:
    post:
      operationId: verifyCode
      summary: Verificar el código; crea la cuenta (con nombre y autorización, HU-02) o inicia sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular, codigo]
              properties:
                celular: { type: string }
                codigo: { type: string, pattern: '^[0-9]{6}$' }
                nombre: { type: string, maxLength: 120, description: 'Solo para cuenta nueva' }
                autorizacionDatos: { type: boolean, description: 'Casilla de la política de datos, sin marcar por defecto (HU-02)' }
      responses:
        '200':
          description: Sesión iniciada. Pone las cookies de sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotar el refresh token (si se reutiliza uno viejo, se revoca la sesión)
      security: []
      responses:
        '200':
          description: Nuevas cookies de sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar sesión (idempotente)
      security: []
      responses:
        '204': { description: Sesión cerrada y cookies vencidas. }

  /me:
    get:
      operationId: getMe
      summary: Usuario y taller de la sesión actual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/Problem' }

  /customers:
    post:
      operationId: registerCustomer
      summary: Buscar o crear un cliente por celular (HU-09). Permiso customer:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [celular, nombre]
              properties:
                celular: { type: string }
                nombre: { type: string, maxLength: 120 }
                correo: { type: string, nullable: true }
      responses:
        '200':
          description: El celular ya existía en el taller; se devuelve ese cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCliente' }
        '201':
          description: Cliente creado con autorización pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCliente' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCustomers
      summary: Clientes del taller; con q busca por nombre o celular. Permiso customer:read
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes: { type: array, items: { $ref: '#/components/schemas/Cliente' } }

  /customers/by-phone/{celular}:
    get:
      operationId: getCustomerByPhone
      summary: Buscar un cliente por celular. Permiso customer:create
      parameters:
        - { name: celular, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/Problem' }

  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Ver un cliente. Permiso customer:read_all
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles:
    post:
      operationId: registerVehicle
      summary: Buscar por placa o crear un vehículo, carro o moto, con su motor (HU-10, HU-11). Permiso vehicle:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [placa]
              properties:
                placa: { type: string, example: 'KLM482' }
                tipo: { type: string, enum: [carro, moto], description: 'Obligatorio solo para placa especial' }
                confirmarPlacaEspecial: { type: boolean }
                clienteId: { type: string, format: uuid, description: 'Obligatorio si el vehículo no existe' }
                marca: { type: string, nullable: true, maxLength: 60 }
                linea: { type: string, nullable: true, maxLength: 60 }
                modeloAnio: { type: integer, nullable: true }
                kilometraje: { type: integer, nullable: true, minimum: 0 }
                cilindraje: { type: string, nullable: true, description: '"1200", "1200 cc" o "1.2 L"; se guarda en cc' }
                turbo: { type: boolean, nullable: true }
      responses:
        '200':
          description: La placa ya existía en el taller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroVehiculo' }
        '201':
          description: Vehículo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroVehiculo' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /vehicles/by-plate/{placa}:
    get:
      operationId: getVehicleByPlate
      summary: Buscar un vehículo por placa. Permiso vehicle:read
      parameters:
        - { name: placa, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}:
    get:
      operationId: getVehicle
      summary: Ver un vehículo. Permiso vehicle:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}/engine:
    patch:
      operationId: updateVehicleEngine
      summary: Cambiar cilindraje y/o turbo; queda en la bitácora (HU-11). Permiso vehicle:update
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"v1"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cilindraje: { type: string, nullable: true }
                turbo: { type: boolean, nullable: true }
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      operationId: openOrder
      summary: Abrir una orden desde la placa (HU-16). Permiso order:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sintoma]
              properties:
                vehiculoId: { type: string, format: uuid }
                placa: { type: string }
                sintoma: { type: string, maxLength: 2000 }
                estadoInicial: { type: string, enum: [por_recibir, recibido] }
                confirmarDuplicada: { type: boolean }
      responses:
        '201':
          description: Orden creada con número consecutivo del taller.
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrders
      summary: Órdenes recientes (paginación por cursor). Permiso order:read
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ordenes, siguiente]
                properties:
                  ordenes: { type: array, items: { $ref: '#/components/schemas/Orden' } }
                  siguiente: { type: string, nullable: true }

  /orders/{id}:
    get:
      operationId: getOrder
      summary: Ver una orden con su historial de estados. Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/mine:
    get:
      operationId: listMyOrders
      summary: Órdenes asignadas a quien consulta (HU-23, HU-81). Permiso order:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ordenes]
                properties:
                  ordenes: { type: array, items: { $ref: '#/components/schemas/Orden' } }

  /orders/{id}/transition:
    post:
      operationId: transitionOrder
      summary: Mover la orden un paso adelante o atrás (HU-20, HU-25). Permiso order:update_state
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado, version]
              properties:
                estado: { $ref: '#/components/schemas/EstadoOrden' }
                version: { type: integer }
                motivo: { type: string, description: 'Obligatorio si el dueño avanza a En reparación sin aprobación' }
                recogidoPor: { type: string, description: 'Obligatorio al pasar a Entregado' }
                accesoriosConfirmados: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancelar una orden con motivo (HU-26). Permiso order:cancel
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, version]
              properties:
                motivo: { type: string }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/assignment:
    patch:
      operationId: assignOrder
      summary: Asignar mecánico y fecha prometida (HU-22). Permiso order:assign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mecanicoId: { type: string, format: uuid, nullable: true }
                fechaPrometida: { type: string, format: date-time, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Orden' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/checklist:
    get:
      operationId: getChecklist
      summary: Checklist de recepción y lo que falta (HU-17, HU-18). Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Checklist' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveChecklist
      summary: Guardar el checklist de recepción (HU-17, HU-18). Permiso evidence:upload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kilometraje: { type: integer, nullable: true }
                combustible: { type: string, nullable: true }
                accesorios: { type: array, items: { type: string } }
                salvedades: { type: array, items: { $ref: '#/components/schemas/Salvedad' } }
      responses:
        '200': { $ref: '#/components/responses/Checklist' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/evidence:
    get:
      operationId: listEvidence
      summary: Fotos y notas de la orden (HU-21). Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [evidencias]
                properties:
                  evidencias: { type: array, items: { $ref: '#/components/schemas/Evidencia' } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addEvidence
      summary: Agregar foto y/o nota (HU-21). La foto va al final del formulario. Permiso evidence:upload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                lado: { type: string }
                nota: { type: string }
                mostrarCliente: { type: boolean }
                foto: { type: string, format: binary }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidencia' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /orders/{id}/evidence/{eid}/file:
    get:
      operationId: getEvidencePhoto
      summary: Descargar la foto de una evidencia (privada). Permiso order:read
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: eid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Imagen
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote:
    get:
      operationId: getQuote
      summary: Cotización de la orden (HU-27). Permiso quote:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/lines:
    post:
      operationId: addQuoteLine
      summary: Agregar un servicio o repuesto a la cotización (HU-27, HU-34). Permiso quote:edit
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, cantidad]
              properties:
                tipo: { type: string, description: 'servicio o repuesto' }
                refId: { type: string, format: uuid, nullable: true }
                descripcion: { type: string }
                cantidad: { type: integer, minimum: 1 }
                precioUnitario: { type: integer, format: int64, nullable: true, description: 'COP sin decimales' }
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/lines/{lineId}:
    delete:
      operationId: removeQuoteLine
      summary: Quitar una línea de la cotización (HU-27). Permiso quote:edit
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/send:
    post:
      operationId: sendQuote
      summary: Enviar la cotización al cliente (HU-27, HU-28). Permiso quote:send
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/quote/response:
    post:
      operationId: registerQuoteResponse
      summary: Registrar la respuesta que llegó por teléfono o mostrador (HU-29, HU-30). Permiso quote:register_response
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, canal]
              properties:
                decision: { type: string }
                canal: { type: string, enum: [telefono, mostrador] }
                itemsAprobados: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Cotizacion' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}/history:
    get:
      operationId: getVehicleHistory
      summary: Todo lo que se le ha hecho a un vehículo (HU-13). Sin dinero si falta money:read. Permiso vehicle:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ordenes]
                properties:
                  ordenes:
                    type: array
                    items:
                      type: object
                      required: [orden, evidencias, cotizacion]
                      properties:
                        orden: { $ref: '#/components/schemas/Orden' }
                        evidencias: { type: array, items: { $ref: '#/components/schemas/Evidencia' } }
                        cotizacion:
                          type: object
                          nullable: true
                          properties:
                            estado: { type: string }
                            total: { type: integer, format: int64 }
                            lineas:
                              type: array
                              items:
                                type: object
                                properties:
                                  tipo: { type: string }
                                  descripcion: { type: string }
                                  cantidad: { type: integer }
                                  precioUnitario: { type: integer, format: int64 }
        '404': { $ref: '#/components/responses/Problem' }

  /vehicles/{id}/owner:
    patch:
      operationId: changeVehicleOwner
      summary: Pasar el vehículo a otro cliente conservando el historial (HU-12). Permiso vehicle:change_owner
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, version]
              properties:
                clienteId: { type: string, format: uuid }
                version: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /customers/{id}/vehicles:
    get:
      operationId: listCustomerVehicles
      summary: Vehículos de un cliente (HU-12). Permiso vehicle:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [vehiculos]
                properties:
                  vehiculos: { type: array, items: { $ref: '#/components/schemas/Vehiculo' } }
        '404': { $ref: '#/components/responses/Problem' }

  /customers/{id}/consent:
    post:
      operationId: registerCustomerConsent
      summary: Registrar la autorización de datos dada en el mostrador (HU-86). Permiso customer:create
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acepta]
              properties:
                acepta: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/Problem' }

  /search:
    get:
      operationId: search
      summary: Buscar por placa, nombre o celular desde cualquier pantalla (HU-14). Permiso vehicle:read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [vehiculos, clientes]
                properties:
                  vehiculos: { type: array, items: { $ref: '#/components/schemas/ResultadoVehiculo' } }
                  clientes:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, celular, vehiculos]
                      properties:
                        id: { type: string, format: uuid }
                        nombre: { type: string }
                        celular: { type: string }
                        vehiculos: { type: array, items: { $ref: '#/components/schemas/ResultadoVehiculo' } }

  /services:
    get:
      operationId: listServices
      summary: Servicios del taller con precio y duración (HU-07). Permiso service:read
      parameters:
        - { name: todos, in: query, description: '1 = incluir inactivos', schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [servicios]
                properties:
                  servicios: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
    post:
      operationId: createService
      summary: Crear un servicio (HU-07). Permiso service:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, tipoVehiculo]
              properties:
                nombre: { type: string }
                tipoVehiculo: { type: string }
                precio: { type: integer, format: int64, nullable: true }
                duracionMin: { type: integer, nullable: true }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problem' }

  /services/{id}:
    patch:
      operationId: updateService
      summary: Editar precio, duración o activar/desactivar (HU-07). Permiso service:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                nombre: { type: string }
                tipoVehiculo: { type: string }
                precio: { type: integer, format: int64, nullable: true }
                duracionMin: { type: integer, nullable: true }
                activo: { type: boolean }
                version: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteService
      summary: Borrar un servicio (HU-07). Permiso service:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problem' }

  /parts:
    get:
      operationId: searchParts
      summary: Buscar repuestos al cotizar (HU-34). El costo solo sale con money:read. Permiso part:read
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: todos, in: query, description: '1 = incluir inactivos (requiere part:manage)', schema: { type: string, enum: ['1'] } }
      responses:
        '200': { $ref: '#/components/responses/Repuestos' }
    post:
      operationId: createPart
      summary: Crear un repuesto (HU-32). Permiso part:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referencia, nombre, tipoVehiculo, precioVenta]
              properties:
                referencia: { type: string }
                nombre: { type: string }
                tipoVehiculo: { type: string }
                costo: { type: integer, format: int64 }
                precioVenta: { type: integer, format: int64 }
                existencia: { type: integer }
                minimo: { type: integer }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repuesto' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /parts/low:
    get:
      operationId: listLowParts
      summary: Repuestos bajo el mínimo (HU-36). Permiso part:read
      responses:
        '200': { $ref: '#/components/responses/Repuestos' }

  /parts/{id}:
    patch:
      operationId: updatePart
      summary: Editar o desactivar un repuesto (HU-32). Permiso part:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                nombre: { type: string }
                tipoVehiculo: { type: string }
                costo: { type: integer, format: int64 }
                precioVenta: { type: integer, format: int64 }
                minimo: { type: integer }
                activo: { type: boolean }
                version: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repuesto' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /parts/{id}/entries:
    post:
      operationId: addPartEntry
      summary: Registrar entrada de mercancía (HU-35). Permiso part:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Cantidad' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repuesto' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /parts/{id}/returns:
    post:
      operationId: returnPart
      summary: Devolver al inventario lo que no se usó en una orden (HU-38). Permiso part:return
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Cantidad' }
      responses:
        '204': { description: Devuelto }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      operationId: listUsers
      summary: Usuarios del taller (HU-80, HU-84). Permiso user:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [usuarios]
                properties:
                  usuarios: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
    post:
      operationId: addUser
      summary: Agregar un mecánico o recepción por celular (HU-80, HU-82). Permiso user:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [celular, nombre, rol]
              properties:
                celular: { type: string }
                nombre: { type: string }
                rol: { type: string, enum: [dueno, recepcion, mecanico] }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /users/{id}:
    patch:
      operationId: setUserActive
      summary: Activar o desactivar un usuario (HU-84). Permiso user:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /me/workshops:
    get:
      operationId: listMyWorkshops
      summary: Talleres a los que pertenece la persona y cuál está activo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [talleres, actual]
                properties:
                  talleres:
                    type: array
                    items:
                      type: object
                      required: [id, nombre]
                      properties:
                        id: { type: string, format: uuid }
                        nombre: { type: string }
                  actual: { type: string, format: uuid }

  /auth/switch:
    post:
      operationId: switchWorkshop
      summary: Cambiar de taller; emite una sesión nueva con cookies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tallerId]
              properties:
                tallerId: { type: string, format: uuid }
      responses:
        '200':
          description: Sesión del taller elegido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '403': { $ref: '#/components/responses/Problem' }

  /workshop:
    get:
      operationId: getWorkshop
      summary: Perfil, horario y estado del arranque del taller (HU-03, HU-08, HU-89)
      responses:
        '200': { $ref: '#/components/responses/Taller' }

  /workshop/onboarding:
    post:
      operationId: onboardWorkshop
      summary: Contar qué tipo de taller tengo y aceptar el contrato de transmisión (HU-03, HU-89). Permiso workshop:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, atiende, ciudad, tamano, contratoAceptado]
              properties:
                nombre: { type: string }
                atiende: { type: string }
                especialidades: { type: array, items: { type: string } }
                ciudad: { type: string }
                tamano: { type: string }
                contratoAceptado: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Taller' }
        '400': { $ref: '#/components/responses/Problem' }

  /workshop/schedule:
    put:
      operationId: setWorkshopSchedule
      summary: Cargar el horario del taller (HU-08). Permiso workshop:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [horario]
              properties:
                horario: { $ref: '#/components/schemas/Horario' }
      responses:
        '200': { $ref: '#/components/responses/Taller' }
        '400': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-sw_at

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      description: 'Obligatorio en toda solicitud que cambia estado; lo agrega el cliente común del frontend.'
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [sweveh] }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Orden:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Orden' }
    Checklist:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Checklist' }
    Cotizacion:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Cotizacion' }
    Repuestos:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [repuestos]
            properties:
              repuestos: { type: array, items: { $ref: '#/components/schemas/Repuesto' } }
    Taller:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Taller' }

  requestBodies:
    Cantidad:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cantidad]
            properties:
              cantidad: { type: integer, minimum: 1 }
              ordenId: { type: string, format: uuid, description: 'Obligatorio en devoluciones' }

  schemas:
    Salvedad:
      type: object
      required: [nota]
      properties:
        nota: { type: string, maxLength: 300 }
        fotoId: { type: string, format: uuid }
        hora: { type: string, format: date-time }

    Checklist:
      type: object
      required: [tipo, accesorios, salvedades, ladosConFoto, ladosPedidos, falta]
      properties:
        tipo: { type: string, enum: [carro, moto] }
        kilometraje: { type: integer, nullable: true }
        combustible: { type: string, nullable: true }
        accesorios: { type: array, items: { type: string } }
        salvedades: { type: array, items: { $ref: '#/components/schemas/Salvedad' } }
        ladosConFoto: { type: array, items: { type: string } }
        ladosPedidos: { type: array, items: { type: string } }
        falta: { type: array, items: { type: string } }
        completadoEn: { type: string, format: date-time, nullable: true }

    Evidencia:
      type: object
      required: [id, lado, nota, tieneFoto, mostrarCliente, etapa, autorId, creadoEn]
      properties:
        id: { type: string, format: uuid }
        lado: { type: string, nullable: true }
        nota: { type: string, nullable: true }
        tieneFoto: { type: boolean }
        mostrarCliente: { type: boolean }
        etapa: { type: string }
        autorId: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time }

    Cotizacion:
      type: object
      required: [id, numero, estado, total, lineas, enviadaEn, respondidaEn, canalRespuesta]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        estado: { type: string, enum: [borrador, enviada, aprobada, rechazada, dudas] }
        total: { type: integer, format: int64, description: 'COP sin decimales' }
        lineas:
          type: array
          items:
            type: object
            required: [id, tipo, refId, descripcion, cantidad, precioUnitario, subtotal, sinStock, aprobada]
            properties:
              id: { type: string, format: uuid }
              tipo: { type: string }
              refId: { type: string, format: uuid, nullable: true }
              descripcion: { type: string }
              cantidad: { type: integer }
              precioUnitario: { type: integer, format: int64 }
              subtotal: { type: integer, format: int64 }
              sinStock: { type: boolean }
              aprobada: { type: boolean, nullable: true }
        enviadaEn: { type: string, format: date-time, nullable: true }
        respondidaEn: { type: string, format: date-time, nullable: true }
        canalRespuesta: { type: string, nullable: true }

    ResultadoVehiculo:
      type: object
      required: [id, placa, tipo, descripcion, clienteId, cliente, ordenAbiertaId, ordenAbierta, estadoOrden]
      properties:
        id: { type: string, format: uuid }
        placa: { type: string }
        tipo: { type: string, enum: [carro, moto] }
        descripcion: { type: string }
        clienteId: { type: string, format: uuid }
        cliente: { type: string }
        ordenAbiertaId: { type: string, format: uuid, nullable: true }
        ordenAbierta: { type: string, nullable: true }
        estadoOrden: { allOf: [{ $ref: '#/components/schemas/EstadoOrden' }], nullable: true }

    Servicio:
      type: object
      required: [id, nombre, tipoVehiculo, precio, duracionMin, activo, version]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipoVehiculo: { type: string }
        precio: { type: integer, format: int64, nullable: true, description: 'COP sin decimales; null = el taller confirma' }
        duracionMin: { type: integer, nullable: true }
        activo: { type: boolean }
        version: { type: integer }

    Repuesto:
      type: object
      required: [id, referencia, nombre, tipoVehiculo, precioVenta, existencia, minimo, bajoMinimo, activo, version]
      properties:
        id: { type: string, format: uuid }
        referencia: { type: string }
        nombre: { type: string }
        tipoVehiculo: { type: string }
        costo: { type: integer, format: int64, description: 'Solo con permiso money:read' }
        precioVenta: { type: integer, format: int64 }
        existencia: { type: integer }
        minimo: { type: integer }
        bajoMinimo: { type: boolean }
        activo: { type: boolean }
        version: { type: integer }

    Miembro:
      type: object
      required: [id, nombre, celular, rol, activo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        celular: { type: string }
        rol: { type: string, enum: [dueno, recepcion, mecanico] }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time }

    Franja:
      type: object
      nullable: true
      description: 'Franja de un día; null = cerrado'
      required: [abre, cierra]
      properties:
        abre: { type: string, example: '07:30' }
        cierra: { type: string, example: '17:30' }

    Horario:
      type: object
      description: 'Horario semanal por día'
      additionalProperties: { $ref: '#/components/schemas/Franja' }

    Taller:
      type: object
      required: [id, nombre, atiende, especialidades, ciudad, tamano, horario, contratoVersion, contratoAceptadoEn, onboardingCompleto]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        atiende: { type: string }
        especialidades: { type: array, items: { type: string } }
        ciudad: { type: string }
        tamano: { type: string }
        horario: { $ref: '#/components/schemas/Horario' }
        contratoVersion: { type: string, nullable: true }
        contratoAceptadoEn: { type: string, format: date-time, nullable: true }
        onboardingCompleto: { type: boolean }

    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: 'Código estable para el frontend' }
        detail: { type: string, description: 'Mensaje en español de Colombia para la persona' }
        field: { type: string }
        request_id: { type: string }

    Sesion:
      type: object
      required: [usuario, taller, roles, cuentaNueva]
      properties:
        usuario:
          type: object
          required: [id, nombre, celular]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            celular: { type: string }
        taller:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        roles: { type: array, items: { type: string, enum: [dueno, recepcion, mecanico] } }
        cuentaNueva: { type: boolean }

    Cliente:
      type: object
      required: [id, nombre, celular, correo, autorizacionEstado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        celular: { type: string, description: '10 dígitos' }
        correo: { type: string, nullable: true }
        autorizacionEstado: { type: string, enum: [pendiente, autorizada, rechazada] }
        creadoEn: { type: string, format: date-time }

    RegistroCliente:
      type: object
      required: [cliente, existente]
      properties:
        cliente: { $ref: '#/components/schemas/Cliente' }
        existente: { type: boolean }

    Vehiculo:
      type: object
      required: [id, clienteId, tipo, placa, formatoPlaca, marca, linea, modeloAnio, kilometraje, cilindrajeCc, turbo, motorPendiente, version, creadoEn]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        tipo: { type: string, enum: [carro, moto] }
        placa: { type: string }
        formatoPlaca: { type: string, enum: [carro, moto, moto_antigua, especial] }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modeloAnio: { type: integer, nullable: true }
        kilometraje: { type: integer, nullable: true }
        cilindrajeCc: { type: integer, nullable: true }
        turbo: { type: boolean, nullable: true }
        motorPendiente: { type: boolean }
        version: { type: integer }
        creadoEn: { type: string, format: date-time }

    RegistroVehiculo:
      type: object
      required: [vehiculo, existente]
      properties:
        vehiculo: { $ref: '#/components/schemas/Vehiculo' }
        existente: { type: boolean }

    EstadoOrden:
      type: string
      enum: [por_recibir, recibido, en_diagnostico, esperando_aprobacion, en_reparacion, listo, entregado, cancelada]

    Orden:
      type: object
      required: [id, numero, codigo, placa, estado, sintoma, version, creadoEn]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        codigo: { type: string, example: 'OS-0045' }
        placa: { type: string }
        estado: { $ref: '#/components/schemas/EstadoOrden' }
        sintoma: { type: string }
        version: { type: integer }
        creadoEn: { type: string, format: date-time }
        mecanicoId: { type: string, format: uuid, nullable: true }
        fechaPrometida: { type: string, format: date-time, nullable: true }
        ejemplo: { type: boolean, description: 'Orden de ejemplo del arranque (HU-05)' }
        recogidoPor: { type: string }
        motivoCancelacion: { type: string }
        cerradaEn: { type: string, format: date-time, nullable: true }
        vehiculo:
          type: object
          required: [id, placa, tipo, marca, linea, modeloAnio, motorPendiente]
          properties:
            id: { type: string, format: uuid }
            placa: { type: string }
            tipo: { type: string, enum: [carro, moto] }
            marca: { type: string, nullable: true }
            linea: { type: string, nullable: true }
            modeloAnio: { type: integer, nullable: true }
            motorPendiente: { type: boolean }
        cliente:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        historial:
          type: array
          items:
            type: object
            required: [desde, hacia, usuarioId, ocurridoEn]
            properties:
              desde: { allOf: [{ $ref: '#/components/schemas/EstadoOrden' }], nullable: true }
              hacia: { $ref: '#/components/schemas/EstadoOrden' }
              usuarioId: { type: string, format: uuid, nullable: true }
              ocurridoEn: { type: string, format: date-time }
