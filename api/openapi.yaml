    get:
      operationId: listDrafts
      summary: Bandeja "Por revisar" con los borradores del agente (HU-62). Permiso inbox:manage
      parameters:
        - { name: todos, in: query, description: '1 = incluir los ya resueltos', schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [borradores]
                properties:
                  borradores: { type: array, items: { $ref: '#/components/schemas/Borrador' } }

  /inbox/{id}:
    post:
      operationId: resolveDraft
      summary: 'Enviar, editar y enviar, o "Lo contesto yo" (HU-62, HU-63). Nada sale sin que el dueño pulse Enviar (RF-18). Permiso inbox:manage'
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [enviar, lo_contesto_yo, descartar] }
                texto: { type: string, nullable: true, description: 'Texto editado por el dueño' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Borrador' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /inbox/stats:
    get:
      operationId: getDraftStats
      summary: Qué tan seguido el dueño edita los borradores (HU-65). Permiso inbox:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enviados, editados, porcentajeEditados]
                properties:
                  enviados: { type: integer }
                  editados: { type: integer }
                  porcentajeEditados: { type: number }

  /assistant/settings:
    get:
      operationId: getAssistantSettings
      summary: Si el agente responde solo (ADR-0028). Permiso inbox:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantSettings' }
    put:
      operationId: setAssistantSettings
      summary: Enciende o apaga el envío automático del agente (HU-67, ADR-0028). Permiso automation:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantSettings' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /conversations:
    get:
      operationId: listConversations
      summary: Conversaciones de WhatsApp del taller. Permiso conversation:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversaciones]
                properties:
                  conversaciones: { type: array, items: { $ref: '#/components/schemas/Conversacion' } }

  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Una conversación con sus mensajes (HU-24). Permiso conversation:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversacion, mensajes]
                properties:
                  conversacion: { $ref: '#/components/schemas/Conversacion' }
                  mensajes: { type: array, items: { $ref: '#/components/schemas/Mensaje' } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setConversationMode
      summary: Pasar la conversación al agente o a una persona (HU-59). Permiso inbox:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modo]
              properties:
                modo: { type: string, enum: [agente, humano] }
      responses:
        '204': { description: Actualizada }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /conversations/{id}/messages:
    post:
      operationId: replyConversation
      summary: Una persona del taller contesta directamente; respeta la ventana de 24 h (HU-47, HU-59). Permiso inbox:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
                ordenId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{id}/messages:
    get:
      operationId: listOrderMessages
      summary: La conversación de WhatsApp dentro de la orden (HU-24). Permiso order:read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [mensajes]
                properties:
                  mensajes: { type: array, items: { $ref: '#/components/schemas/Mensaje' } }
        '404': { $ref: '#/components/responses/Problem' }

  /whatsapp/channel:
    get:
      operationId: getWhatsAppChannel
      summary: Canal de WhatsApp del taller (número de prueba o real, HU-101). Permiso workshop:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canal]
                properties:
                  canal:
                    type: object
                    nullable: true
                    properties:
                      proveedor: { type: string }
                      numero: { type: string }
    put:
      operationId: setWhatsAppChannel
      summary: 'Solo fuera de producción: cambia el número del taller entre el simulador (prueba_local) y el WhatsApp de prueba de WAHA (waha, ADR-0027). Permiso workshop:manage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proveedor]
              properties:
                proveedor: { type: string, enum: [prueba_local, waha] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canal]
                properties:
                  canal:
                    type: object
                    nullable: true
                    properties:
                      proveedor: { type: string }
                      numero: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /whatsapp/waha:
    get:
      operationId: getWahaSession
      summary: 'Solo fuera de producción: estado de la sesión de WAHA y, si espera el escaneo, el QR como data URL (ADR-0027). Permiso workshop:manage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WahaSession' }
        '404': { $ref: '#/components/responses/Problem' }

  /whatsapp/waha/start:
    post:
      operationId: startWahaSession
      summary: 'Solo fuera de producción: crea o arranca la sesión de WAHA para escanear el QR (ADR-0027). Permiso workshop:manage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WahaSession' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /simulator/inbound:
    post:
      operationId: simulateInbound
      summary: 'Solo fuera de producción: simula un mensaje de cliente por el canal local, con el formato del webhook de Meta (D-01). Permiso workshop:manage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [celular, texto]
              properties:
                celular: { type: string }
                nombre: { type: string }
                texto: { type: string }
                boton: { type: string, description: 'id del botón de respuesta, si el cliente pulsó uno' }
      responses:
        '202': { description: Recibido }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAudit
      summary: Bitácora de quién cambió qué, con filtros (HU-88). Permiso audit:read
      parameters:
        - { name: entidad, in: query, schema: { type: string } }
        - { name: usuario, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [eventos]
                properties:
                  eventos:
                    type: array
                    items:
                      type: object
                      required: [id, accion, entidad, actorTipo, ocurridoEn]
                      properties:
                        id: { type: string }
                        accion: { type: string }
                        entidad: { type: string }
                        entidadId: { type: string, nullable: true }
                        actorTipo: { type: string }
                        actorId: { type: string, nullable: true }
                        antes: { type: object, nullable: true }
                        despues: { type: object, nullable: true }
                        ocurridoEn: { type: string, format: date-time }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-sw_at

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      description: 'Obligatorio en toda solicitud que cambia estado; lo agrega el cliente común del frontend.'
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [sweveh] }

  responses:
    Importacion:
      description: Resultado fila por fila de la importación
      content:
        application/json:
          schema:
            type: object
            required: [filas, conError, importadas, avisos]
            properties:
              avisos: { type: array, items: { type: string }, description: 'Lo que no impide importar, p. ej. columnas que no se reconocen' }
              conError: { type: integer }
              importadas: { type: integer }
              filas:
                type: array
                items:
                  type: object
                  required: [fila, referencia, nombre, estado, errores]
                  properties:
                    fila: { type: integer }
                    referencia: { type: string }
                    nombre: { type: string }
                    estado: { type: string, enum: [ok, error] }
                    errores: { type: array, items: { type: string } }
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Orden:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Orden' }
    Checklist:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Checklist' }
    Cotizacion:
      description: 'OK. Todas las operaciones de cotización responden envueltas: {"cotizacion": ...}'
      content:
        application/json:
          schema:
            type: object
            required: [cotizacion]
            properties:
              cotizacion: { allOf: [{ $ref: '#/components/schemas/Cotizacion' }], nullable: true }
    Repuestos:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [repuestos]
            properties:
              repuestos: { type: array, items: { $ref: '#/components/schemas/Repuesto' } }
    Taller:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Taller' }

    Automatizaciones:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [automatizaciones]
            properties:
              automatizaciones: { type: array, items: { $ref: '#/components/schemas/Automatizacion' } }

  requestBodies:
    Cantidad:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cantidad]
            properties:
              cantidad: { type: integer, minimum: 1 }
              ordenId: { type: string, format: uuid, description: 'Obligatorio en devoluciones' }

  schemas:
    AssistantSettings:
      type: object
      required: [autoEnvio]
      properties:
        autoEnvio: { type: boolean, description: 'true = el agente responde solo; false = todo pasa por Por revisar' }
    WahaSession:
      type: object
      required: [configurado]
      properties:
        configurado: { type: boolean }
        sesion: { type: string }
        estado: { type: string, description: 'STOPPED, STARTING, SCAN_QR_CODE, WORKING, FAILED, NOT_FOUND o SIN_CONEXION' }
        numero: { type: string, description: 'chat del número vinculado, p. ej. 573009999999@c.us' }
        qr: { type: string, description: 'data:image/png;base64,… mientras espera el escaneo' }
    ItemRecepcion:
      type: object
      required: [clave, nombre]
      properties:
        clave: { type: string, description: 'Estable; vacía = se arma con el nombre' }
        nombre: { type: string, maxLength: 60 }
    Parametros:
      type: object
      additionalProperties: false
      required: [usarEsperandoRepuesto, usarControlCalidad, fotosMinimas, kmObligatorio, itemsCarro, itemsMoto, ivaPct, preciosConIva,
        tarifaHora, descuentoMaxPct, descuentoRecepcion, vigenciaDias, version]
      properties:
        usarEsperandoRepuesto: { type: boolean }
        usarControlCalidad: { type: boolean }
        fotosMinimas: { type: integer, minimum: 0, maximum: 8 }
        kmObligatorio: { type: boolean }
        itemsCarro: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/ItemRecepcion' } }
        itemsMoto: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/ItemRecepcion' } }
        ivaPct: { type: integer, minimum: 0, maximum: 30, description: 'Por defecto 19, a confirmar con un contador' }
        preciosConIva: { type: boolean, description: 'Los precios de lista ya incluyen IVA' }
        tarifaHora: { type: integer, format: int64, nullable: true, minimum: 0 }
        descuentoMaxPct: { type: integer, minimum: 0, maximum: 100 }
        descuentoRecepcion: { type: boolean }
        vigenciaDias: { type: integer, minimum: 1, maximum: 90 }
        version: { type: integer }
    SistemaVehiculo:
      type: string
      enum: [motor, frenos, suspension, direccion, electrico, transmision, refrigeracion, llantas, carroceria, otro]
    Gravedad:
      type: string
      enum: [urgente, recomendado, puede_esperar]
    Hallazgo:
      type: object
      required: [id, sistema, descripcion, gravedad, codigosFalla, creadoEn]
      properties:
        id: { type: string, format: uuid }
        sistema: { $ref: '#/components/schemas/SistemaVehiculo' }
        descripcion: { type: string }
        gravedad: { $ref: '#/components/schemas/Gravedad' }
        codigosFalla: { type: array, items: { type: string } }
        creadoEn: { type: string, format: date-time }
        manoObra: { type: integer, format: int64, nullable: true, description: 'Mano de obra estimada en COP' }
    Kpi:
      type: object
      required: [codigo, titulo, valor, texto, detalle, queSignifica]
      properties:
        codigo: { type: string }
        titulo: { type: string }
        valor: { type: number, nullable: true }
        texto: { type: string, description: 'Valor ya formateado en español de Colombia' }
        detalle: { type: string }
        queSignifica: { type: string, description: 'Explicación en palabras del taller (HU-75)' }

    Pendiente:
      type: object
      required: [tipo, titulo, detalle, tono]
      properties:
        tipo: { type: string }
        titulo: { type: string }
        detalle: { type: string }
        ordenId: { type: string, format: uuid }
        conversacionId: { type: string, format: uuid, description: 'Conversación que espera a una persona (HU-59)' }
        tono: { type: string, enum: [err, warn, info] }

    Automatizacion:
      type: object
      required: [codigo, nombre, disparador, activa, proximamente, enviaMensaje, editable, texto, datos, ejecucionesSemana, costo]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        disparador: { type: string }
        activa: { type: boolean }
        proximamente: { type: boolean }
        enviaMensaje: { type: boolean }
        editable: { type: boolean }
        texto: { type: string }
        datos: { type: array, items: { type: string }, nullable: true }
        ejecucionesSemana: { type: integer }
        costo: { type: string }

    Borrador:
      type: object
      required: [id, conversacionId, celular, mensajeCliente, intencion, propuesto, estado, origen, creadoEn]
      properties:
        id: { type: string, format: uuid }
        conversacionId: { type: string, format: uuid }
        celular: { type: string }
        mensajeCliente: { type: string }
        intencion: { type: string }
        propuesto: { type: string, description: 'Texto que propone la IA o la plantilla; no sale sin aprobación (RF-18)' }
        final: { type: string, nullable: true }
        fuentes:
          type: array
          nullable: true
          description: 'De dónde salió cada dato de la respuesta (HU-64)'
          items:
            type: object
            required: [campo, valor, origen]
            properties:
              campo: { type: string, description: 'precio, horario…' }
              valor: { type: string }
              origen: { type: string, description: 'Servicio: Cambio de aceite, Horario del taller…' }
        accion: { type: object, nullable: true, description: 'Acción propuesta (p. ej. crear la orden con la placa, HU-55)' }
        estado: { type: string }
        origen: { type: string }
        creadoEn: { type: string, format: date-time }
        resueltoEn: { type: string, format: date-time, nullable: true }

    Conversacion:
      type: object
      required: [id, celular, clienteId, modo, pideHumano, ventanaAbiertaHasta]
      properties:
        id: { type: string, format: uuid }
        celular: { type: string }
        clienteId: { type: string, format: uuid, nullable: true }
        modo: { type: string, enum: [agente, humano] }
        pideHumano: { type: boolean }
        ventanaAbiertaHasta: { type: string, format: date-time, nullable: true }
        ultimoMensaje: { type: string }
        ultimoEn: { type: string, format: date-time }

    Mensaje:
      type: object
      required: [id, direccion, tipo, cuerpo, estado, origen, creadoEn]
      properties:
        id: { type: string, format: uuid }
        direccion: { type: string }
        tipo: { type: string }
        cuerpo: { type: string }
        payload:
          type: object
          nullable: true
          description: 'Botones de respuesta rápida (máx. 3, DR-08); en un mensaje del cliente, el botón que pulsó'
          properties:
            botones:
              type: array
              items:
                type: object
                required: [id, titulo]
                properties:
                  id: { type: string }
                  titulo: { type: string }
            boton: { type: string }
            nombre: { type: string }
        estado: { type: string }
        origen: { type: string }
        ordenId: { type: string, format: uuid, nullable: true }
        automatizacion: { type: string, nullable: true }
        error: { type: string, nullable: true }
        creadoEn: { type: string, format: date-time }

    Salvedad:
      type: object
      required: [nota]
      properties:
        nota: { type: string, maxLength: 300 }
        fotoId: { type: string, format: uuid }
        hora: { type: string, format: date-time }

    ItemRevisado:
      type: object
      required: [clave, nombre, estado]
      properties:
        clave: { type: string }
        nombre: { type: string }
        estado: { type: string, enum: [bien, mal, no_tiene, ''], description: 'Vacío = sin revisar' }
        nota: { type: string, maxLength: 300 }
    Checklist:
      type: object
      required: [tipo, accesorios, salvedades, ladosConFoto, ladosPedidos, falta]
      properties:
        tipo: { type: string, enum: [carro, moto] }
        kilometraje: { type: integer, nullable: true }
        combustible: { type: string, nullable: true }
        accesorios: { type: array, items: { type: string } }
        salvedades: { type: array, items: { $ref: '#/components/schemas/Salvedad' } }
        ladosConFoto: { type: array, items: { type: string } }
        ladosPedidos: { type: array, items: { type: string } }
        falta: { type: array, items: { type: string } }
        completadoEn: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/ItemRevisado' } }
        fotosMinimas: { type: integer, description: 'Parámetro del taller' }
        kmObligatorio: { type: boolean }

    Evidencia:
      type: object
      required: [id, lado, nota, tieneFoto, mostrarCliente, etapa, autorId, creadoEn]
      properties:
        id: { type: string, format: uuid }
        lado: { type: string, nullable: true }
        nota: { type: string, nullable: true }
        tieneFoto: { type: boolean }
        mostrarCliente: { type: boolean }
        etapa: { type: string }
        autorId: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time }
        grupoId: { type: string, format: uuid, nullable: true, description: 'Fotos subidas juntas con una nota' }
        hallazgoId: { type: string, format: uuid, nullable: true, description: 'Foto de un hallazgo del diagnóstico' }

    Cotizacion:
      type: object
      required: [id, numero, estado, total, lineas, enviadaEn, respondidaEn, canalRespuesta]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        estado: { type: string, enum: [borrador, enviada, aprobada, rechazada, dudas] }
        total: { type: integer, format: int64, description: 'COP sin decimales' }
        lineas:
          type: array
          items:
            type: object
            required: [id, tipo, refId, descripcion, cantidad, precioUnitario, subtotal, sinStock, aprobada]
            properties:
              id: { type: string, format: uuid }
              tipo: { type: string }
              refId: { type: string, format: uuid, nullable: true }
              descripcion: { type: string }
              cantidad: { type: integer }
              precioUnitario: { type: integer, format: int64 }
              subtotal: { type: integer, format: int64 }
              sinStock: { type: boolean }
              precioLibre: { type: boolean, description: 'El precio lo puso una persona y se puede corregir' }
              aprobada: { type: boolean, nullable: true }
              descuentoPct: { type: integer }
              horas: { type: number, nullable: true, description: 'Mano de obra por horas × tarifa del taller' }
        enviadaEn: { type: string, format: date-time, nullable: true }
        respondidaEn: { type: string, format: date-time, nullable: true }
        canalRespuesta: { type: string, nullable: true }
        subtotal: { type: integer, format: int64, description: 'Cantidad × precio, antes de descuentos' }
        descuento: { type: integer, format: int64 }
        ivaPct: { type: integer, description: 'Copiado de los parámetros al crear la cotización' }
        iva: { type: integer, format: int64 }
        preciosConIva: { type: boolean }
        venceEn: { type: string, format: date-time, nullable: true }
        vencida: { type: boolean }

    ResultadoVehiculo:
      type: object
      required: [id, placa, tipo, descripcion, clienteId, cliente, ordenAbiertaId, ordenAbierta, estadoOrden]
      properties:
        id: { type: string, format: uuid }
        placa: { type: string }
        tipo: { type: string, enum: [carro, moto] }
        descripcion: { type: string }
        clienteId: { type: string, format: uuid }
        cliente: { type: string }
        ordenAbiertaId: { type: string, format: uuid, nullable: true }
        ordenAbierta: { type: string, nullable: true }
        estadoOrden: { allOf: [{ $ref: '#/components/schemas/EstadoOrden' }], nullable: true }

    Servicio:
      type: object
      required: [id, nombre, tipoVehiculo, precio, duracionMin, activo, version]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipoVehiculo: { type: string }
        precio: { type: integer, format: int64, nullable: true, description: 'COP sin decimales; null = el taller confirma' }
        duracionMin: { type: integer, nullable: true }
        activo: { type: boolean }
        version: { type: integer }
        categoria: { allOf: [{ $ref: '#/components/schemas/Categoria' }], nullable: true }
        garantiaDias: { type: integer, nullable: true }

    Categoria:
      type: string
      enum: [motor, frenos, suspension, direccion, electrico, transmision, refrigeracion, llantas, carroceria, filtros, lubricantes, otro]

    Repuesto:
      type: object
      required: [id, referencia, nombre, tipoVehiculo, precioVenta, existencia, minimo, bajoMinimo, activo, version]
      properties:
        id: { type: string, format: uuid }
        referencia: { type: string }
        nombre: { type: string }
        tipoVehiculo: { type: string }
        costo: { type: integer, format: int64, description: 'Solo con permiso money:read' }
        precioVenta: { type: integer, format: int64 }
        existencia: { type: integer }
        minimo: { type: integer }
        bajoMinimo: { type: boolean }
        activo: { type: boolean }
        version: { type: integer }
        marca: { type: string, description: 'Vacío = sin dato' }
        categoria: { type: string, description: 'Una de Categoria o vacío' }
        ubicacion: { type: string }
        referenciaOem: { type: string, description: 'Referencia original o equivalente' }

    Miembro:
      type: object
      required: [id, nombre, celular, rol, activo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        celular: { type: string }
        rol: { type: string, enum: [dueno, recepcion, mecanico] }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time }

    Franja:
      type: object
      nullable: true
      description: 'Franja de un día; null = cerrado'
      required: [abre, cierra]
      properties:
        abre: { type: string, example: '07:30' }
        cierra: { type: string, example: '17:30' }

    Horario:
      type: object
      description: 'Horario semanal por día'
      additionalProperties: { $ref: '#/components/schemas/Franja' }

    Taller:
      type: object
      required: [id, nombre, atiende, especialidades, ciudad, tamano, horario, contratoVersion, contratoAceptadoEn, onboardingCompleto]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        atiende: { type: string }
        especialidades: { type: array, items: { type: string } }
        ciudad: { type: string }
        tamano: { type: string }
        horario: { $ref: '#/components/schemas/Horario' }
        contratoVersion: { type: string, nullable: true }
        contratoAceptadoEn: { type: string, format: date-time, nullable: true }
        onboardingCompleto: { type: boolean }

    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: 'Código estable para el frontend' }
        detail: { type: string, description: 'Mensaje en español de Colombia para la persona' }
        field: { type: string }
        request_id: { type: string }

    Sesion:
      type: object
      required: [usuario, taller, roles, cuentaNueva]
      properties:
        usuario:
          type: object
          required: [id, nombre, celular]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            celular: { type: string }
        taller:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        roles: { type: array, items: { type: string, enum: [dueno, recepcion, mecanico] } }
        permisos:
          type: array
          items: { type: string }
          description: 'Permisos recurso:acción del rol; la UI los usa solo para ocultar, el servidor siempre verifica (R-05)'
        cuentaNueva: { type: boolean }

    Cliente:
      type: object
      required: [id, nombre, celular, correo, autorizacionEstado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        celular: { type: string, description: '10 dígitos' }
        correo: { type: string, nullable: true }
        autorizacionEstado: { type: string, enum: [pendiente, autorizada, rechazada] }
        creadoEn: { type: string, format: date-time }

    RegistroCliente:
      type: object
      required: [cliente, existente]
      properties:
        cliente: { $ref: '#/components/schemas/Cliente' }
        existente: { type: boolean }

    Vehiculo:
      type: object
      required: [id, clienteId, tipo, placa, formatoPlaca, marca, linea, modeloAnio, kilometraje, cilindrajeCc, turbo, motorPendiente, version, creadoEn]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        tipo: { type: string, enum: [carro, moto] }
        placa: { type: string }
        formatoPlaca: { type: string, enum: [carro, moto, moto_antigua, especial] }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modeloAnio: { type: integer, nullable: true }
        kilometraje: { type: integer, nullable: true }
        cilindrajeCc: { type: integer, nullable: true }
        turbo: { type: boolean, nullable: true }
        energia: { type: string, nullable: true, enum: [gasolina, diesel, gas, hibrido, hibrido_enchufable, electrico, null], description: 'Moto: gasolina o electrico' }
        aspiracion: { type: string, nullable: true, enum: [atmosferico, turbo, supercargado, null], description: 'Si llega, manda sobre turbo; moto: atmosferico o turbo' }
        transmision: { type: string, nullable: true, enum: [manual, automatica, cvt, doble_embrague, amt, semiautomatica, null], description: 'Carro: manual, automatica, cvt, doble_embrague, amt; moto: manual, automatica, semiautomatica' }
        traccion: { type: string, nullable: true, enum: [delantera, trasera, awd, 4x4, null], description: 'Solo carro' }
        ciclo: { type: string, nullable: true, enum: [2t, 4t, null], description: 'Solo moto' }
        refrigeracion: { type: string, nullable: true, enum: [aire, liquido, null], description: 'Solo moto' }
        color: { type: string, nullable: true, maxLength: 60 }
        carroceria: { type: string, nullable: true, enum: [sedan, hatchback, suv, pickup, van, otra, null], description: 'Solo carro' }
        llanta: { type: string, nullable: true, maxLength: 20, description: '205/55 R16 o 90/90-17' }
        motorPendiente: { type: boolean, description: 'Falta energía, caja, o en combustión cilindraje y aspiración (y ciclo en moto)' }
        version: { type: integer }
        creadoEn: { type: string, format: date-time }

    RegistroVehiculo:
      type: object
      required: [vehiculo, existente]
      properties:
        vehiculo: { $ref: '#/components/schemas/Vehiculo' }
        existente: { type: boolean }

    EstadoOrden:
      type: string
      enum: [por_recibir, recibido, en_diagnostico, esperando_aprobacion, en_reparacion, esperando_repuesto, control_calidad, listo, entregado, cancelada]
      description: 'esperando_repuesto y control_calidad solo si el taller los activa en sus parámetros'

    Orden:
      type: object
      required: [id, numero, codigo, placa, estado, sintoma, version, creadoEn]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        codigo: { type: string, example: 'OS-0045' }
        placa: { type: string }
        estado: { $ref: '#/components/schemas/EstadoOrden' }
        sintoma: { type: string }
        version: { type: integer }
        creadoEn: { type: string, format: date-time }
        mecanicoId: { type: string, format: uuid, nullable: true }
        fechaPrometida: { type: string, format: date-time, nullable: true }
        ejemplo: { type: boolean, description: 'Orden de ejemplo del arranque (HU-05)' }
        recogidoPor: { type: string }
        motivoCancelacion: { type: string }
        cerradaEn: { type: string, format: date-time, nullable: true }
        constancia:
          type: string
          nullable: true
          enum: [conforme, observado, null]
          description: 'Respuesta del cliente a la constancia de recibo por WhatsApp (HU-19)'
        constanciaEn: { type: string, format: date-time, nullable: true }
        vehiculo:
          type: object
          required: [id, placa, tipo, marca, linea, modeloAnio, motorPendiente]
          properties:
            id: { type: string, format: uuid }
            placa: { type: string }
            tipo: { type: string, enum: [carro, moto] }
            marca: { type: string, nullable: true }
            linea: { type: string, nullable: true }
            modeloAnio: { type: integer, nullable: true }
            motorPendiente: { type: boolean }
        cliente:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        historial:
          type: array
          items:
            type: object
            required: [desde, hacia, usuarioId, ocurridoEn]
            properties:
              desde: { allOf: [{ $ref: '#/components/schemas/EstadoOrden' }], nullable: true }
              hacia: { $ref: '#/components/schemas/EstadoOrden' }
              usuarioId: { type: string, format: uuid, nullable: true }
              ocurridoEn: { type: string, format: date-time }
