# SonarQube Cloud (docs/06 §13.3). Organización y clave del proyecto llegan por variables del
# repositorio (vars.SONAR_ORGANIZATION, vars.SONAR_PROJECT_KEY) cuando el equipo cree la cuenta.
sonar.sources=cmd,internal,web/src,db
sonar.tests=internal,web/src
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx
sonar.exclusions=**/sqlcgen/**,web/src/shared/api/schema.d.ts,**/node_modules/**,web/dist/**
# Exclusiones de cobertura justificadas (R-11): código generado, composition root y ayudantes de prueba.
sonar.coverage.exclusions=cmd/**,**/sqlcgen/**,internal/platform/testdb/**,web/src/main.tsx,web/src/test/**,db/**
sonar.sourceEncoding=UTF-8
# Quality gate propuesto (se configura en SonarQube Cloud): cobertura de código nuevo >= 80 %,
# 0 bugs y 0 vulnerabilidades nuevos, hotspots revisados.
