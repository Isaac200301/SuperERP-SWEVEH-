# Entorno local de SWEVEH. Solo datos Ficticio. Las contraseñas son de desarrollo y
# no sirven en ningún otro entorno (staging y producción usan el gestor de secretos).
name: sweveh

services:
  postgres:
    # Postgres 16: alinear con la versión del proyecto de Supabase al crearlo (`Sin dato` hasta entonces).
    image: postgres:16-alpine
    container_name: sweveh-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: postgres
      SWEVEH_ROLE_PASSWORD: sweveh_dev_only
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    networks: [sweveh]

  # WhatsApp no oficial para la demo (ADR-0027). Solo con número de prueba y sin datos reales. No arranca con
  # `make up`: `make waha`. Los secretos (WAHA_API_KEY, WAHA_WEBHOOK_SECRET) salen del .env local.
  waha:
    image: devlikeapro/waha:gows-2026.10.1
    container_name: sweveh-waha
    profiles: [waha]
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://host.docker.internal:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: message,message.ack
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wahadata:/app/.sessions
    networks: [sweveh]

volumes:
  pgdata:
  wahadata:

networks:
  sweveh:
    name: sweveh
